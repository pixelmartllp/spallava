<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<script>try{if(window.localStorage.getItem('sp-theme')==='light'){document.documentElement.classList.add('spl');}}catch(e){}</script>
<style>
/* Blog chrome for shashipallava.com - the same tokens as the homepage
   (website/page.html), so /blog/ and every post read as one site. */
:root{--bg:#0A0A0B;--card:#131315;--line:#2A2A2E;--fg:#FAFAFA;--dim:#C4C4CB;--muted:#A2A2AB;
  --gold:#FBBD23;--gold-hi:#FFD666;--on-gold:#0A0A0B;--gold-soft:rgba(251,189,35,.10);
  --gold-line:rgba(251,189,35,.35);--bar-bg:rgba(10,10,11,.88)}
:root.spl{--bg:#FBF7F0;--card:#FFFFFF;--line:#E6DED0;--fg:#17120F;--dim:#3D3630;--muted:#6E655C;
  --gold:#9A6B06;--gold-hi:#C9921C;--on-gold:#FFFFFF;--gold-soft:rgba(154,107,6,.08);
  --gold-line:rgba(154,107,6,.32);--bar-bg:rgba(251,247,240,.9)}
body{margin:0;background:var(--bg)!important;color:var(--fg)!important;
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wp-site-blocks{padding:0!important}
.wp-site-blocks>*{margin-block-start:0!important}
.spb-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 18px;
  background:var(--bar-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.spb-bar .lg img{height:40px;width:auto;display:block}
.spb-bar nav{display:flex;gap:18px;margin-left:auto;align-items:center}
.spb-bar nav a{color:var(--dim);text-decoration:none;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.spb-bar nav a.on{color:var(--gold)}
.spb-tg{width:40px;height:40px;border:1px solid var(--fg);border-radius:12px;background:var(--fg);
  display:grid;place-items:center;cursor:pointer;padding:0}
.spb-tg svg{width:19px;height:19px;stroke:var(--bg);fill:none;stroke-width:1.9;stroke-linecap:round;grid-area:1/1}
.spb-tg .mo{display:none}
.spl .spb-tg .mo{display:block}
.spl .spb-tg .su{display:none}
.spb-main{max-width:680px;margin:0 auto!important;padding:40px 18px 64px!important}
.spb-eyebrow{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold)!important;border:1px solid var(--gold-line);border-radius:999px;padding:6px 14px;
  background:var(--gold-soft);margin:0 0 14px;text-decoration:none!important}
.spb-main h1{font-family:inherit!important;font-weight:800!important;font-size:clamp(2rem,8vw,2.8rem)!important;
  line-height:1.1!important;letter-spacing:-.03em!important;margin:0!important;color:var(--fg)!important;text-wrap:balance}
.spb-lede{color:var(--muted);margin:12px 0 0}
.spb-list{list-style:none;padding:0!important;margin:28px 0 0!important;display:flex;flex-direction:column;gap:12px}
.spb-list>li{margin:0!important}
.spb-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px!important;transition:border-color .2s ease}
.spb-card:hover{border-color:var(--gold-line)}
.spb-card h2{font-family:inherit!important;font-size:1.25rem!important;font-weight:800!important;
  letter-spacing:-.02em!important;line-height:1.2!important;margin:0!important}
.spb-card h2 a{color:var(--fg)!important;text-decoration:none!important}
.spb-card h2 a::after{content:"";position:absolute;inset:0}
.spb-card .wp-block-post-featured-image{margin:0 0 16px!important;border-radius:12px;overflow:hidden;aspect-ratio:1}
.spb-card .wp-block-post-featured-image img{width:100%!important;height:100%!important;object-fit:cover;object-position:50% 0;display:block}
.spb-hero{margin:24px 0 0!important;border-radius:16px;overflow:hidden}
.spb-hero img{width:100%!important;height:auto!important;display:block}
.spb-card .wp-block-post-excerpt{margin:8px 0 0!important}
.spb-card .wp-block-post-excerpt p{color:var(--muted);font-size:.92rem;margin:0}
.spb-card .wp-block-post-date{margin-top:12px!important;font-size:.68rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold)}
.spb-card .wp-block-post-date a{color:inherit;text-decoration:none}
.spb-main .wp-block-query-pagination{margin-top:24px!important;gap:12px}
.spb-main .wp-block-query-pagination a{color:var(--gold);font-weight:700;text-decoration:none}
.spb-meta{margin-top:14px!important;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.spb-body{margin-top:26px!important}
.spb-body>*{max-width:none!important}
.spb-body p{color:var(--dim);font-size:1.06rem;margin:0 0 1.1em!important}
.spb-body p:first-child strong{display:block;color:var(--fg);font-size:1.3rem;font-weight:700;line-height:1.35;
  border-left:3px solid var(--gold);padding-left:14px}
.spb-body a{color:var(--gold);text-underline-offset:3px}
.spb-cta{margin-top:34px;border:1px solid var(--gold-line);border-radius:20px;padding:24px 22px;text-align:center;background:var(--card)}
.spb-cta h3{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--fg)}
.spb-cta p{color:var(--muted);margin:8px 0 0;font-size:.92rem}
.spb-btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.spb-btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:12px;
  font-size:.83rem;font-weight:700;letter-spacing:.04em;text-decoration:none!important;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--on-gold)!important;border:1px solid transparent}
.spb-btn.gh{background:transparent;color:var(--fg)!important;border-color:var(--line)}
.spb-nav{display:flex;justify-content:space-between;gap:16px;margin-top:30px!important;padding-top:20px;
  border-top:1px solid var(--line);font-size:.9rem}
.spb-nav>*{margin:0!important}
.spb-nav a{color:var(--dim);text-decoration:none}
.spb-nav a:hover{color:var(--gold)}
.spb-foot{border-top:1px solid var(--line);padding:26px 18px;text-align:center;color:var(--muted);font-size:.76rem}
.spb-foot img{height:96px;width:auto;margin:0 auto 16px;display:block}
.spb-foot .fl{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:12px}
.spb-foot .fl a{color:var(--dim);text-decoration:none;font-weight:600}
@media (min-width:900px){
  .spb-bar{padding:12px 36px}
  .spb-main{padding-top:64px!important}
  .spb-btns{flex-direction:row;justify-content:center}
  .spb-wide{max-width:1100px}
  .spb-wide .spb-list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
}
</style>
<header class="spb-bar">
  <a class="lg" href="/"><img src="https://shashipallava.com/wp-content/uploads/2026/09/sp-logo-mark.png" alt="Shashi Pallava"></a>
  <nav><a href="/">Home</a><a class="on" href="/blog/">Blog</a>
  <button class="spb-tg" type="button" aria-label="Switch theme"><svg class="su" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="mo" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></nav>
</header>
