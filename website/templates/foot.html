<script>
(function(){
  /* same storage key as the homepage toggle, so the choice follows the reader */
  var b = document.querySelector('.spb-tg');
  if (!b) { return; }
  b.addEventListener('click', function(){
    var on = document.documentElement.classList.toggle('spl');
    var v = 'dark';
    if (on) { v = 'light'; }
    try { window.localStorage.setItem('sp-theme', v); } catch (e) {}
  });
})();
</script>
