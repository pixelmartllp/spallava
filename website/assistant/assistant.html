<style>
/* ============================================================
   Shashi's Assistant - a floating helper on every page.
   No AI and no server. It answers from two places:
     1. built-in answers below, written from FAQ.txt and the site
     2. the knowledge base Shashi teaches it: child pages of the
        private "Assistant Knowledge" page (id 141), titled
        "Topic: Headline". Published = visitors get it too,
        Private = only she sees it, in admin mode.
   Logged into WordPress, it switches to admin mode: type a topic,
   get its headlines, open a chapter, present it full screen, or
   teach a new one. Injected by push.py (homepage) and
   push_templates.py (blog), so it is edited in this one file.
   ============================================================ */
.spa{--a-bg:#121214;--a-card:#1A1A1D;--a-line:#2A2A2E;--a-fg:#FAFAFA;--a-dim:#C4C4CB;--a-muted:#A2A2AB;
  --a-gold:#FBBD23;--a-gold-hi:#FFD666;--a-on-gold:#0A0A0B;--a-soft:rgba(251,189,35,.10);--a-gline:rgba(251,189,35,.35);
  --a-me:#2A2416;--a-shadow:0 18px 50px -12px rgba(0,0,0,.7);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
.sp.light .spa,.spl .spa{--a-bg:#FFFFFF;--a-card:#FBF7F0;--a-line:#E6DED0;--a-fg:#17120F;--a-dim:#3D3630;--a-muted:#6E655C;
  --a-gold:#9A6B06;--a-gold-hi:#C9921C;--a-on-gold:#FFFFFF;--a-soft:rgba(154,107,6,.08);--a-gline:rgba(154,107,6,.32);
  --a-me:#F3E9D2;--a-shadow:0 18px 50px -14px rgba(23,18,15,.35)}
.spa *{box-sizing:border-box}
.spa p{margin:0}
.spa-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;display:flex;align-items:center;
  justify-content:center;gap:8px;width:56px;height:56px;padding:0;border-radius:999px;border:1px solid transparent;cursor:pointer;
  background:linear-gradient(135deg,var(--a-gold-hi),var(--a-gold));color:var(--a-on-gold);
  font-family:inherit;font-size:.8rem;font-weight:800;letter-spacing:.02em;box-shadow:0 10px 30px -8px rgba(251,189,35,.55)}
/* the homepage has a bottom tab bar on phones - sit above it */
.sp .spa-fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.spa-fab span{display:none}
.spa-fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spa.open .spa-fab{display:none}
.spa-panel{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none;flex-direction:column;
  height:min(88vh,700px);background:var(--a-bg);color:var(--a-fg);border:1px solid var(--a-line);
  border-radius:20px 20px 0 0;box-shadow:var(--a-shadow);overflow:hidden}
.spa.open .spa-panel{display:flex}
.spa-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--a-line)}
.spa-head img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--a-gline)}
.spa-head .t{font-weight:800;font-size:.95rem;line-height:1.2}
.spa-head .s{font-size:.68rem;color:var(--a-muted);font-weight:600}
.spa-head .badge{display:none;margin-left:6px;padding:2px 7px;border-radius:999px;font-size:.58rem;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;background:var(--a-gold);color:var(--a-on-gold);vertical-align:2px}
.spa.admin .spa-head .badge{display:inline-block}
.spa-hb{display:flex;gap:6px;margin-left:auto}
.spa-head>div:nth-child(2){min-width:0}
.spa-hb{flex:none}
.spa-hb button{white-space:nowrap;height:36px;border-radius:10px;border:1px solid var(--a-line);background:transparent;color:var(--a-fg);
  font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer;padding:0 10px}
.spa-x{width:36px;font-size:1rem;padding:0}

.spa-msg p+p{margin-top:6px}
.spa-bot{align-self:flex-start;background:var(--a-card);border:1px solid var(--a-line);border-bottom-left-radius:4px;color:var(--a-dim)}
.spa-bot b{color:var(--a-fg)}
.spa-me{align-self:flex-end;background:var(--a-me);color:var(--a-fg);border-bottom-right-radius:4px}
.spa-acts{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.spa-act{display:inline-flex;align-items:center;min-height:38px;padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--a-gline);background:var(--a-soft);color:var(--a-gold);font-family:inherit;font-size:.8rem;
  font-weight:700;text-decoration:none;text-align:left}
.spa-act.main{background:linear-gradient(135deg,var(--a-gold-hi),var(--a-gold));color:var(--a-on-gold);border-color:transparent}
.spa-heads{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.spa-heads button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;min-height:48px;
  padding:10px 14px;border-radius:12px;border:1px solid var(--a-line);background:var(--a-card);color:var(--a-fg);
  font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.spa-heads button small{flex:none;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a-muted)}
/* always-visible quick questions */

.spa-quick button{flex:none;min-height:32px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--a-gline);background:var(--a-soft);color:var(--a-gold);font-family:inherit;font-size:.76rem;font-weight:700}
.spa-quick button.main{background:linear-gradient(135deg,var(--a-gold-hi),var(--a-gold));color:var(--a-on-gold);border-color:transparent}
.spa-form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.spa-form input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--a-line);
  background:var(--a-card);color:var(--a-fg);font-family:inherit;font-size:16px}
.spa-form button{width:46px;height:46px;flex:none;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--a-gold-hi),var(--a-gold));color:var(--a-on-gold)}
.spa-form button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.spa-form[hidden]{display:none}
/* chapter reader, teach form and the Talk to Shashi form - cover the panel */
.spa-sw{display:flex;gap:6px;padding:4px;border-radius:12px;border:1px solid var(--a-line);background:var(--a-card)}
.spa-sw button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--a-dim);font-family:inherit;
  font-size:.8rem;font-weight:800;cursor:pointer}
.spa-sw button.on{background:linear-gradient(135deg,var(--a-gold-hi),var(--a-gold));color:var(--a-on-gold)}
.spa-tf .fld{display:flex;flex-direction:column;gap:6px}
.spa-tf .fld[hidden]{display:none}
.spa-cc{display:flex;gap:8px}
.spa-tf .spa-cc select{flex:0 0 120px;width:120px;padding:11px 6px}
.spa-tf .spa-cc input{flex:1;min-width:0}
.spa-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.spa-reader{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;background:var(--a-bg)}
.spa-reader.on{display:flex}
.spa-rh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--a-line)}
.spa-rh button,.spa-rh a{height:36px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;
  border:1px solid var(--a-line);background:transparent;color:var(--a-fg);font-family:inherit;font-size:.74rem;
  font-weight:700;cursor:pointer;text-decoration:none}
.spa-rh .pres{margin-left:auto;border-color:var(--a-gline);color:var(--a-gold)}
.spa-rh{flex-wrap:wrap}
.spa-rb{flex:1;overflow-y:auto;padding:18px 18px 28px;color:var(--a-dim);font-size:.98rem;line-height:1.65}
.spa-rb .tp{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--a-gold)}
.spa-rb h2.hd{margin:6px 0 14px;font-size:1.4rem;font-weight:800;line-height:1.2;color:var(--a-fg)}
.spa-rb p{margin:0 0 .9em}
/* the homepage hides every br (wpautop debris) - chapters need theirs */
.sp .spa br,.spa br{display:inline!important}
.spa-rb h2,.spa-rb h3{color:var(--a-fg);margin:1.2em 0 .5em;line-height:1.3}
.spa-rb ul,.spa-rb ol{padding-left:1.3em;margin:0 0 1em}
.spa-rb img{max-width:100%;height:auto;border-radius:10px}
.spa-rb .priv{display:inline-block;margin-top:4px;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--a-line);color:var(--a-muted)}
.spa.page .spa-panel{left:0;right:0;top:0;bottom:0;width:auto;height:100%;border-radius:0}
.spa.page .spa-fab{display:none}
.spa-reader.present .spa-rb{font-size:1.5rem;line-height:1.6;padding:5vh 7vw}
.spa-reader.present .spa-rb h2.hd{font-size:2.6rem}
.spa-reader:fullscreen{background:var(--a-bg)}
.spa-tf{display:flex;flex-direction:column;gap:6px}
.spa-tf label{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a-muted);margin-top:8px}
.spa-tf input,.spa-tf textarea,.spa-tf select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--a-line);
  background:var(--a-card);color:var(--a-fg);font-family:inherit;font-size:16px}
.spa-tf textarea{min-height:200px;resize:vertical;line-height:1.5}
.spa-tf .hint{font-size:.74rem;color:var(--a-muted)}
.spa-tf .err{color:#E5484D;font-size:.8rem;min-height:1em}
.spa-tf .save{margin-top:10px;min-height:48px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:.9rem;background:linear-gradient(135deg,var(--a-gold-hi),var(--a-gold));color:var(--a-on-gold)}
@media (min-width:900px){
  .spa-fab{bottom:24px;right:24px;width:auto;height:52px;padding:0 18px 0 14px}
  .spa-fab span{display:inline}
  .spa-panel{left:auto;right:24px;bottom:24px;width:410px;height:min(82vh,680px);border-radius:20px}
}
</style>

<script>
(function(){
  /* No ampersands, pipes or angle brackets anywhere in this script:
     WordPress escapes them inside post content and the whole file dies.
     AMP, LT and GT are built from character codes where they are needed. */
  var root = document.getElementById('spa');
  if (!root) { return; }
  var AMP = String.fromCharCode(38);
  var LT = String.fromCharCode(60);
  var GT = String.fromCharCode(62);
  var KB_ROOT = 141;
  var WA = '919876732099';
  var COMMUNITY = 'https://chat.whatsapp.com/C2tCs8KDwiYCEmvj9CLXNy';
  var onHome = document.querySelector('.sp .hero') !== null;
  var base = '/';
  if (onHome) { base = ''; }
  var panel = root.querySelector('.spa-panel');
  var fab = root.querySelector('.spa-fab');
  var log = root.querySelector('.spa-log');
  var quick = root.querySelector('.spa-quick');
  var form = root.querySelector('.spa-form');
  var input = form.querySelector('input');
  var reader = root.querySelector('.spa-reader');
  var rhead = reader.querySelector('.spa-rh');
  var rbody = reader.querySelector('.spa-rb');
  var sub = root.querySelector('.spa-head .s');
  var started = false;
  var testOn = false;
  var isAdmin = false;
  var nonce = '';
  var kb = [];
  var kbReady = null;

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text) { n.textContent = text; }
    return n;
  }
  function down(){ log.scrollTop = log.scrollHeight; }
  function wa(text){ return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text); }
  function esc(s){
    return s.split(AMP).join(AMP + 'amp;').split(LT).join(AMP + 'lt;').split(GT).join(AMP + 'gt;');
  }
  function tag(t, inner){ return LT + t + GT + inner + LT + '/' + t + GT; }

  /* a bot message: lines become paragraphs, **x** becomes bold */
  function bot(lines, acts){
    var m = el('div', 'spa-msg spa-bot');
    lines.forEach(function(line){
      var p = el('p');
      line.split('**').forEach(function(b, i){
        if (i % 2 === 1) { p.appendChild(el('b', '', b)); }
        else { p.appendChild(document.createTextNode(b)); }
      });
      m.appendChild(p);
    });
    log.appendChild(m);
    if (acts) { buttons(acts); }
    down();
  }
  function me(text){ log.appendChild(el('div', 'spa-msg spa-me', text)); down(); }
  /* acts: [label, href or function, main?] */
  function buttons(acts){
    var row = el('div', 'spa-acts');
    acts.forEach(function(a){
      var b;
      if (typeof a[1] === 'string') {
        b = el('a', 'spa-act', a[0]);
        b.href = a[1];
        if (a[1].indexOf('http') === 0) { b.target = '_blank'; b.rel = 'noopener'; }
        else { b.addEventListener('click', close); }
      } else {
        b = el('button', 'spa-act', a[0]);
        b.type = 'button';
        b.addEventListener('click', function(){ me(a[0]); a[1](); });
      }
      if (a[2]) { b.className = 'spa-act main'; }
      row.appendChild(b);
    });
    log.appendChild(row);
    down();
  }

  /* ---------------- built-in answers ----------------
     Every fact here is Shashi's own, from FAQ.txt and the site.
     Do not add anything she has not said. Everything is in English; the
     Hindi switch on the page translates it for anyone who wants Hindi. */
  var RRR = 'Revive, Rise ' + AMP + ' Relive';
  var A = {};
  var MENU = function(){ return [
    ['Book a 1:1 session', function(){ talk('book'); }, true],
    ['Programs ' + AMP + ' fees', function(){ A.programs(); }],
    ['Free webinar', function(){ A.webinar(); }],
    ['Brain Game', function(){ playGame('game'); }]]; };
  A.hello = function(){
    if (isAdmin) {
      bot(['**Admin mode.** Hi Shashi!',
        'Type a topic (for example **Emotion**) and I will list every headline under it. Click one to open the full chapter; use **Full screen** during a webinar.',
        'To teach me a new chapter, tap **＋ Teach** below.']);
      return;
    }
    bot(['Hi, I am your **RRR Agent**!']);
  };
  A.greet = function(){
    bot(['Hello! How can I help you today?',
      'You can ask me about Shashi, her programs and fees, the free webinar, booking a 1:1 session, or the Brain Game and missions.'], MENU());
  };
  A.help = function(){
    bot(['Here is what I can help with:',
      '**Programs and fees** - the free webinar and the 6-month ' + RRR + ' program.',
      '**Talk to Shashi** - request a call back or book a 1:1 session.',
      '**Play ' + AMP + ' Grow** - the Brain Game, monthly missions and your points wallet.',
      'Or just type your question.'], MENU());
  };
  A.programs = function(){
    bot(['There are **two ways** to begin with Shashi:',
      '**1. Live Webinar - free.** Online and open to everyone. The easiest way to see whether this way of working is right for you.',
      '**2. ' + RRR + ' - ₹999 for 6 months.** Work on your mindset, confidence, emotional well-being and relationships: a private WhatsApp community, interactive live webinars, practical challenges and missions on Mentie Go, and **one personal 1:1 session** with Shashi. 100% online, for women aged 18 to 55.',
      'Want to go deeper? There are also Silver, Gold and Platinum memberships.'], [
      ['Join the program', base + '#pay', true], ['Free webinar', base + '#register'], ['Memberships', '/membership/'], ['How do I pay?', function(){ A.price(); }]]);
  };
  A.price = function(){
    bot(['**' + RRR + ': ₹999** for the full 6 months. The webinar is completely **free**.',
      'Pay by UPI: scan the QR code or send ₹999 to the UPI ID **shashipallav@ybl**, then share the screenshot on WhatsApp - Shashi adds you herself.',
      'Card and netbanking are coming soon. Memberships: Silver ₹9,999, Gold ₹49,999, Platinum ₹4,99,999.'], [
      ['Pay ₹999', base + '#pay', true],
      ['Send screenshot', wa('Hi Shashi, I have paid 999 for Revive, Rise and Relive. Sending the screenshot now.')],
      ['Memberships', '/membership/']]);
  };
  A.webinar = function(){
    var lines = ['**Free live webinar** - for women who know they are capable of more, but feel stuck, overwhelmed or confused somewhere.',
      'You learn simple, practical ways to shift your mindset, build confidence, handle emotions and build healthier relationships - and you can ask Shashi your questions directly. You leave with a new direction, not just motivation.'];
    var acts = [['Register free', base + '#register', true]];
    fetch('/wp-json/wp/v2/pages?slug=webinar-details').then(function(r){ return r.json(); }).then(function(list){
      if (list) {
        if (list.length) {
          var d = el('div');
          d.innerHTML = list[0].content.rendered;
          d.querySelectorAll('p').forEach(function(p){
            var t = p.textContent.trim();
            var at = t.indexOf(':');
            if (at === -1) { return; }
            var k = t.slice(0, at).trim();
            var v = t.slice(at + 1).trim();
            if (v.length === 0) { return; }
            if (k.toLowerCase() === 'note') { return; }
            lines.push('**' + k + ':** ' + v);
          });
        }
      }
      bot(lines, acts);
    }).catch(function(){ bot(lines, acts); });
  };
  A.therapy = function(){
    bot(['**No - coaching and therapy are different.**',
      'Coaching works on your present: your thoughts, beliefs, patterns, communication and relationships - and above all, what you can do differently from here.',
      'It is not a place to diagnose or treat mental health conditions, and it never replaces professional clinical care. If Shashi feels you need clinical or therapeutic support, she will tell you honestly and point you to the right professional.',
      'Not every problem is solved by coaching - and asking for the right help is not weakness, it is wisdom.']);
  };
  A.language = function(){
    bot(['Sessions run in **English, Hindi or Hinglish** - whichever feels most natural to you.',
      'You do not need to be fluent. If ideas land better in English but feelings come out in Hindi, Hinglish is perfectly fine.',
      'This website can also be read in Hindi - tap the **हिं** button at the top.']);
  };
  A.online = function(){
    bot(['Everything is **100% online**, so you can join from anywhere.',
      'You connect through a WhatsApp community, interactive webinars, and practical challenges and missions on Mentie Go. No travel, no change to your routine.',
      'Shashi is based in Chandigarh, Punjab, and coaches women across India.']);
  };
  A.who = function(){
    bot(['The program is for **women aged 18 to 55** - homemakers, working professionals, entrepreneurs, students, mothers, daughters, married or unmarried - or anyone at a new turning point in life.',
      'Your growth is not defined by your relationship status or your role. Your story may be different, but everyone deserves to grow.',
      'The free webinar is open to everyone.']);
  };
  A.about = function(){
    bot(['**Shashi Pallava** - Life, Relationship ' + AMP + ' Mindset Coach, Mindset Mentor and Entrepreneur, based in Chandigarh, Punjab.',
      'She works with women who want to grow without losing themselves in the process. Sessions combine coaching conversations, practical mindset tools and communication techniques.',
      '**Certified Life Coach**',
      'Coaching with her is not about being told what to do - it is a safe space to see for yourself what you feel, why you react the way you do, and what you really want.'], [
      ['About Shashi', '/about-shashi-pallava/'], ['Talk to Shashi', function(){ talk('call'); }, true]]);
  };
  A.contact = function(){
    bot(['Happy to connect you with Shashi. Leave your details and she will get back to you personally.',
      'Choose a **call back**, or **book a 1:1 session** for a date that suits you.'], [
      ['Book a 1:1 session', function(){ talk('book'); }, true],
      ['Request a call back', function(){ talk('call'); }]]);
  };
  A.book = function(){ talk('book'); };
  A.community = function(){
    bot(['Shashi\'s **WhatsApp community** - women who practise personal development, not just read about it. One thought every morning, and women walking the same road.'], [
      ['Join the community', COMMUNITY, true]]);
  };
  A.blog = function(){
    bot(['The blog has short reads on boundaries, self-worth, healing and mindset - two minutes each, with practical steps.'], [
      ['Read the blog', '/blog/', true]]);
  };
  A.crisis = function(){

  var STOP = ['the', 'is', 'are', 'a', 'an', 'to', 'of', 'and', 'or', 'in', 'on', 'for', 'my', 'me', 'i', 'it', 'how', 'what',
    'why', 'when', 'do', 'does', 'can', 'with', 'you', 'your', 'about', 'kya', 'hai', 'hain', 'ho', 'ka', 'ki', 'ke', 'ko',

    'please', 'batao', 'bataiye', 'bataye', 'chahiye', 'mujhe', 'mera', 'meri', 'apna', 'apni'];
  function words(s){
    var out = [];
    norm(s).split(' ').forEach(function(w){
      if (w.length === 0) { return; }
      if (w.length === 1) { return; }
      if (STOP.indexOf(w) !== -1) { return; }
      /* fold a plain plural so emotions finds emotion */
      if (w.length !== Math.min(w.length, 4)) {
        if (w.slice(-1) === 's') { if (w.slice(-2) !== 'ss') { w = w.slice(0, -1); } }
      }
      if (out.indexOf(w) === -1) { out.push(w); }
    });
    return out;
  }
  function loadKB(){

  function search(q){
    var qw = words(q);
    var hits = [];
    kb.forEach(function(item){
      var s = 0;
      qw.forEach(function(w){
        /* a word in the headline outweighs the same word in keywords or text */
        if (item.hw.indexOf(w) !== -1) { s = s + 5; }
        else if (item.kw.indexOf(w) !== -1) { s = s + 3; }
        else if (item.tw.indexOf(w) !== -1) { s = s + 3; }
        else if (item.bw.indexOf(w) !== -1) { s = s + 1; }
      });
      /* needs a headline or keyword hit, or three words of the body */
      if (Math.min(s, 3) === 3) { hits.push({item: item, s: s}); }
    });
    hits.sort(function(a, b){ return b.s - a.s; });
    return hits;
  }

        });
      }).catch(function(e){
        save.disabled = false;
        save.textContent = 'Save chapter';
        err.textContent = 'Could not save: ' + e.message;
      });
    });
    f.appendChild(save);
    rbody.appendChild(f);
    reader.classList.add('on');
    tp.focus();
  }

  /* ---------------- routing a typed question ---------------- */
  function answer(q){
    var scores = intentScores(q);
    if (scores[0] !== 0) { A.crisis(); return; }
    var ready = kbReady;
    if (!ready) { ready = loadKB(); }
    ready.then(function(){
      var t = topicOf(q);
      if (t) { showTopic(t); return; }
      var hits = search(q);
      var best = Math.max.apply(null, scores);
      var list = hits.slice(0, 8).map(function(h){ return h.item; });
      /* admin: the list goes into the chat, and a clear winner opens on top of
         it straight away, ready to present - Back shows the rest */
      if (isAdmin) {
        if (hits.length === 1) { openChapter(hits[0].item); return; }
        if (hits.length) {
          if (hits[0].s !== hits[1].s) {
            headlines(list, 'Found these — the best match is open:');
            openChapter(hits[0].item);
            return;
          }
        }
      }
      if (hits.length) {
        /* admin always gets the list; for visitors a strong knowledge-base
           match beats a built-in answer */
        if (isAdmin) { headlines(list, 'Found these — click one to open it:'); return; }
        if (Math.min(hits[0].s, 6) === 6) { headlines(list, 'Found these — click one to open it:'); return; }
        if (best === 0) { headlines(list, 'Found these — click one to open it:'); return; }
      }
      if (best === 0) { A.unknown(q); return; }
      var name = INTENTS[scores.indexOf(best)][0];
      if (name === 'eq') { playGame('game'); return; }
      if (name === 'missions') { playGame('missions'); return; }
      if (name === 'wallet') { playGame('wallet'); return; }
      A[name](q);
    });
  }

  /* ---------------- quick bar: always visible ---------------- */
  function chip(label, fn, main){
    var b = el('button', '', label);
    b.type = 'button';
    if (main) { b.className = 'main'; }
    b.addEventListener('click', function(){
      if (testOn) { endTest(); }
      closeReader();
      me(label);
      fn();
    });
    quick.appendChild(b);
  }
  function drawQuick(){
    quick.textContent = '';
    if (isAdmin) {
      var t = el('button', 'main', '＋ Teach');
      t.type = 'button';
      t.addEventListener('click', function(){ teach(''); });
      quick.appendChild(t);
      topics().forEach(function(name){ chip(name, function(){ showTopic(name); }); });
      chip('Brain Game', startTest);
      return;
    }
    chip('Brain Game', startTest, true);
    chip('Missions', function(){ playGame('missions'); });
    chip('Programs ' + AMP + ' fees', A.programs);
    chip('Free webinar', A.webinar);
    chip('Is this therapy?', A.therapy);
    chip('Book a 1:1 session', A.book);
    chip('Talk to Shashi', A.contact);
  }

  /* ---------------- Play and Grow ----------------
     The Brain Game, missions and wallet live in their own full-screen app
     (website/game/game.js, printed in every footer by the SP Game snippet).
     The assistant only opens it on the right tab. */
  function playGame(tab){
    if (window.SPGame) { close(); window.SPGame.open(tab); return; }
    bot(['The game is still loading — please try again in a moment.']);
  }
  function startTest(){ playGame('game'); }
  function endTest(){ testOn = false; }

  /* ---------------- open / close / end ---------------- */
  function checkAdmin(){
    /* only a logged-in visitor has the toolbar; nobody else pays for the request */
    if (!document.body.classList.contains('admin-bar')) { return Promise.resolve(); }
    return fetch('/wp-admin/admin-ajax.php?action=rest-nonce', {credentials: 'same-origin'}).then(function(r){
      return r.text();
    }).then(function(t){
      t = t.trim();
      if (t === '0') { return; }
      if (t.length !== 10) { return; }
      nonce = t;
      isAdmin = true;
      root.classList.add('admin');
      sub.textContent = 'Admin mode · type a topic or ＋ Teach';
    }).catch(function(){});
  }
  function begin(){
    started = true;
    checkAdmin().then(function(){
      drawQuick();
      loadKB();
      A.hello();
    });
  }
  function open(){
    root.classList.add('open');
    if (!started) { begin(); }
    if (!testOn) { setTimeout(function(){ input.focus({preventScroll: true}); }, 60); }
  }
  function close(){
    closeReader();
    root.classList.remove('open');
    root.classList.remove('page');
  }
  function endChat(){
    if (testOn) { endTest(); }
    closeReader();
    log.textContent = '';
    form.hidden = false;
    input.value = '';
    A.hello();
  }
  fab.addEventListener('click', open);
  root.querySelector('.spa-x').addEventListener('click', close);
  root.querySelector('.spa-end').addEventListener('click', endChat);
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') { return; }
    if (reader.classList.contains('on')) { closeReader(); return; }
    close();
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var q = input.value.trim();
    if (q.length === 0) { return; }
    input.value = '';
    me(q);
    setTimeout(function(){ answer(q); }, 200);
  });
  /* any link to #eq-test opens the assistant straight into the check */
  function goTest(){
    open();
    var go = function(){ if (!testOn) { startTest(); } };
    if (kbReady) { go(); } else { setTimeout(go, 400); }
  }
  function fromHash(){
    if (location.hash === '#eq-test') {
      goTest();
      history.replaceState(null, '', location.pathname);
    }
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href$="#eq-test"]');
    if (!a) { return; }
    e.preventDefault();
    var menuOpen = document.querySelector('.sp.menu-open .burger');
    if (menuOpen) { menuOpen.click(); }
    goTest();
  });
  window.addEventListener('hashchange', fromHash);
  fromHash();
  var kbId = parseInt(new URLSearchParams(location.search).get('kb'), 10);
  if (kbId) {
    root.classList.add('page');
    root.classList.add('open');
    started = true;
    checkAdmin().then(function(){
      drawQuick();
      A.hello();
      return loadKB();
    }).then(function(){
      var hit = kb.filter(function(k){ return k.id === kbId; })[0];
      if (hit) { openChapter(hit); }
      else { bot(['This chapter was not found — it may be private or removed.']); }
    });
  }
})();
</script>
