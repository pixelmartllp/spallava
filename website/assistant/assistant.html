<style>

   Shashi's Assistant - a floating helper on every page.
   No AI and no server. It answers from two places:

<script>
(function(){
  /* No ampersands, pipes or angle brackets anywhere in this script:
     WordPress escapes them inside post content and the whole file dies.
     AMP, LT and GT are built from character codes where they are needed. */
  var root = document.getElementById('spa');
  if (!root) { return; }
  var AMP = String.fromCharCode(38);
  var LT = String.fromCharCode(60);
  var GT = String.fromCharCode(62);
  var KB_ROOT = 141;
  var WA = '919876732099';
  var COMMUNITY = 'https://chat.whatsapp.com/C2tCs8KDwiYCEmvj9CLXNy';

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text) { n.textContent = text; }
    return n;
  }
  function down(){ log.scrollTop = log.scrollHeight; }
  function wa(text){ return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text); }
  function esc(s){
    return s.split(AMP).join(AMP + 'amp;').split(LT).join(AMP + 'lt;').split(GT).join(AMP + 'gt;');
  }
  function tag(t, inner){ return LT + t + GT + inner + LT + '/' + t + GT; }

  /* a bot message: lines become paragraphs, **x** becomes bold */
  function bot(lines, acts){
    var m = el('div', 'spa-msg spa-bot');
    lines.forEach(function(line){
      var p = el('p');
      line.split('**').forEach(function(b, i){
        if (i % 2 === 1) { p.appendChild(el('b', '', b)); }
        else { p.appendChild(document.createTextNode(b)); }
      });
      m.appendChild(p);
    });
    log.appendChild(m);
    if (acts) { buttons(acts); }
    down();
  }
  function me(text){ log.appendChild(el('div', 'spa-msg spa-me', text)); down(); }
  /* acts: [label, href or function, main?] */
  function buttons(acts){
    var row = el('div', 'spa-acts');
    acts.forEach(function(a){
      var b;
      if (typeof a[1] === 'string') {
        b = el('a', 'spa-act', a[0]);
        b.href = a[1];
        if (a[1].indexOf('http') === 0) { b.target = '_blank'; b.rel = 'noopener'; }
        else { b.addEventListener('click', close); }
      } else {
        b = el('button', 'spa-act', a[0]);
        b.type = 'button';
        b.addEventListener('click', function(){ me(a[0]); a[1](); });
      }
      if (a[2]) { b.className = 'spa-act main'; }
      row.appendChild(b);
    });
    log.appendChild(row);
    down();
  }

  /* ---------------- built-in answers ----------------
     Every fact here is Shashi's own, from FAQ.txt and the site.
     Do not add anything she has not said. */
  var RRR = 'Revive, Rise ' + AMP + ' Relive';

    bot(['Namaste! Main **Shashi Pallava** ki assistant hoon.',

  };
  A.programs = function(){
    bot(['Shashi ke saath shuru karne ke **do raste** hain:',
      '**1. Live Webinar — Free.** Online, sabke liye. Dekhne ka sabse aasaan tareeka ki ye kaam karne ka tareeka aapke liye hai ya nahi.',
      '**2. ' + RRR + ' — ₹999, 6 mahine.** Mindset, confidence, emotional well-being aur relationships par kaam: private WhatsApp community, interactive live webinars, Mentie Go par practical challenges aur missions, aur Shashi ke saath **ek personal 1:1 session**. 100% online, women aged 18 to 55 ke liye.'], [
      ['Join the program', base + '#pay', true], ['Free webinar', base + '#register'], ['How do I pay?', function(){ A.price(); }]]);
  };
  A.price = function(){
    bot(['**' + RRR + ': ₹999** — poore 6 mahine ke liye. Webinar bilkul **free** hai.',
      'Payment UPI se: QR scan kijiye ya UPI ID **shashipallav@ybl** par ₹999 bhejiye, phir screenshot WhatsApp par bhejiye — Shashi khud aapko add karti hain.',
      'Card aur netbanking jald aa rahe hain.'], [
      ['Pay ₹999', base + '#pay', true],
      ['Send screenshot', wa('Hi Shashi, I have paid 999 for Revive, Rise and Relive. Sending the screenshot now.')]]);
  };
  A.webinar = function(){
    var lines = ['**Free live webinar** — un women ke liye jo jaanti hain ki wo aur bhi kar sakti hain, par kahin stuck, overwhelmed ya confused mehsoos karti hain.',
      'Mindset badalne, confidence badhane, emotions sambhalne aur healthier relationships ke simple, practical tareeke — aur apne sawaal seedhe Shashi se. “Aapko sirf motivation nahi, ek nayi direction milegi.”'];
    var acts = [['Register free', base + '#register', true]];
    fetch('/wp-json/wp/v2/pages?slug=webinar-details').then(function(r){ return r.json(); }).then(function(list){
      if (list) {
        if (list.length) {
          var d = el('div');
          d.innerHTML = list[0].content.rendered;
          d.querySelectorAll('p').forEach(function(p){
            var t = p.textContent.trim();
            var at = t.indexOf(':');
            if (at === -1) { return; }
            var k = t.slice(0, at).trim();

            if (k.toLowerCase() === 'note') { return; }
            lines.push('**' + k + ':** ' + v);

      bot(lines, acts);
    }).catch(function(){ bot(lines, acts); });
  };

      'Free webinar sabke liye open hai.']);
  };
  A.about = function(){
    bot(['**Shashi Pallava** — Life, Relationship ' + AMP + ' Mindset Coach.',

  /* keyword intents - Hinglish and English, matched as whole words.

  function norm(q){
    return ' ' + q.toLowerCase().replace(/[^a-z0-9:ऀ-ॿ ]+/g, ' ').replace(/ +/g, ' ').trim() + ' ';
  }
  function intentScores(q){
    var t = norm(q);
    return INTENTS.map(function(it){
      var s = 0;
      it[1].forEach(function(k){ if (t.indexOf(' ' + k + ' ') !== -1) { s = s + 1; } });
      return s;

  /* ---------------- knowledge base ----------------
     Child pages of KB_ROOT. Title "Topic: Headline"; an optional first
     paragraph "Keywords: a, b, c". Visitors read published ones only;
     admin mode also reads private ones, with a REST nonce. */
  var STOP = ['the', 'is', 'are', 'a', 'an', 'to', 'of', 'and', 'or', 'in', 'on', 'for', 'my', 'me', 'i', 'it', 'how', 'what',
    'why', 'when', 'do', 'does', 'can', 'with', 'you', 'your', 'about', 'kya', 'hai', 'hain', 'ho', 'ka', 'ki', 'ke', 'ko',
    'se', 'me', 'mein', 'main', 'mai', 'hum', 'aap', 'kaise', 'kyu', 'kyun', 'kab', 'koi', 'kuch', 'bhi', 'to', 'na', 'nahi',
    'ye', 'yeh', 'wo', 'woh', 'aur', 'par', 'karna', 'karu', 'karun', 'kare', 'karein', 'krna', 'tha', 'thi', 'raha', 'rahi',
    'please', 'batao', 'bataiye', 'bataye', 'chahiye', 'mujhe', 'mera', 'meri', 'apna', 'apni'];
  function words(s){
    var out = [];
    norm(s).split(' ').forEach(function(w){
      if (w.length === 0) { return; }
      if (w.length === 1) { return; }
      if (STOP.indexOf(w) !== -1) { return; }
      if (out.indexOf(w) === -1) { out.push(w); }
    });
    return out;
  }
  function loadKB(){
    var url = '/wp-json/wp/v2/pages?parent=' + KB_ROOT + AMP + 'per_page=100' + AMP + 'orderby=menu_order' + AMP + 'order=asc' + AMP + '_fields=id,title,content,status,link';
    var opts = {credentials: 'same-origin'};
    if (isAdmin) {
      url = url + AMP + 'status=publish,private';
      opts.headers = {'X-WP-Nonce': nonce};
    }
    kbReady = fetch(url, opts).then(function(r){ return r.json(); }).then(function(list){
      kb = [];
      if (!Array.isArray(list)) { return; }
      list.forEach(function(p){
        var holder = el('div');
        holder.innerHTML = p.title.rendered;
        var title = holder.textContent.replace(/^Private: /, '').trim();
        var at = title.indexOf(':');
        var topic = 'General';
        var head = title;
        if (at !== -1) { topic = title.slice(0, at).trim(); head = title.slice(at + 1).trim(); }
        var body = el('div');
        body.innerHTML = p.content.rendered;
        var keys = [];
        var first = body.querySelector('p');
        if (first) {
          var ft = first.textContent.trim();
          if (ft.toLowerCase().indexOf('keywords:') === 0) {
            keys = words(ft.slice(9));
            first.remove();
          }
        }
        kb.push({id: p.id, topic: topic, head: head, html: body.innerHTML, text: body.textContent.trim(),
          priv: p.status === 'private', tw: words(topic), hw: words(head), kw: keys, bw: words(body.textContent)});
      });
      if (isAdmin) { drawQuick(); }
    }).catch(function(){ kb = []; });
    return kbReady;
  }
  function search(q){
    var qw = words(q);
    var hits = [];
    kb.forEach(function(item){
      var s = 0;
      qw.forEach(function(w){
        if (item.hw.indexOf(w) !== -1) { s = s + 3; }
        else if (item.kw.indexOf(w) !== -1) { s = s + 3; }
        else if (item.tw.indexOf(w) !== -1) { s = s + 2; }
        else if (item.bw.indexOf(w) !== -1) { s = s + 1; }
      });
      /* needs a headline or keyword hit, or three words of the body */
      if (Math.min(s, 3) === 3) { hits.push({item: item, s: s}); }
    });
    hits.sort(function(a, b){ return b.s - a.s; });
    return hits;
  }
  function topics(){
    var out = [];
    kb.forEach(function(k){ if (out.indexOf(k.topic) === -1) { out.push(k.topic); } });
    return out.sort();
  }
  function topicOf(q){
    var t = q.trim().toLowerCase();
    var found = null;
    topics().forEach(function(name){ if (name.toLowerCase() === t) { found = name; } });
    return found;
  }
  function headlines(list, intro){
    bot([intro]);
    var box = el('div', 'spa-heads');
    list.forEach(function(item){
      var b = el('button');

      if (item.priv) { tagText = item.topic + ' · only me'; }

      box.appendChild(b);
    });
    log.appendChild(box);
    down();
  }
  function showTopic(name){
    var list = kb.filter(function(k){ return k.topic === name; });
    headlines(list, '**' + name + '** — ' + list.length + ' headline. Kisi par click kijiye:');
  }
  function kbAnswer(hits){
    var top = hits[0].item;
    var short = top.text;
    if (short.length !== Math.min(short.length, 320)) { short = short.slice(0, 300).replace(/\s+\S*$/, '') + '…'; }
    var acts = [['Read full answer', function(){ openChapter(top); }, true]];
    hits.slice(1, 3).forEach(function(h){ acts.push([h.item.head, function(){ openChapter(h.item); }]); });
    bot(['**' + top.head + '**', short], acts);
  }

      fetch('/wp-json/wp/v2/pages', {method: 'POST', credentials: 'same-origin',

          parent: KB_ROOT, meta: {slim_seo: {noindex: '1'}}})
      }).then(function(r){ return r.json(); }).then(function(p){

  /* ---------------- routing a typed question ---------------- */
  function answer(q){
    var scores = intentScores(q);
    if (scores[0] !== 0) { A.crisis(); return; }
    var ready = kbReady;
    if (!ready) { ready = loadKB(); }
    ready.then(function(){
      if (isAdmin) {
        var t = topicOf(q);
        if (t) { showTopic(t); return; }
        var found = search(q);
        if (found.length) {
          headlines(found.slice(0, 8).map(function(h){ return h.item; }), 'Ye chapters mile:');
          return;
        }
      }
      var hits = search(q);
      var best = Math.max.apply(null, scores);
      if (hits.length) {
        /* a strong knowledge-base match beats a built-in answer */
        if (Math.min(hits[0].s, 6) === 6) { kbAnswer(hits); return; }
        if (best === 0) { kbAnswer(hits); return; }
      }
      if (best === 0) { A.unknown(q); return; }
      var name = INTENTS[scores.indexOf(best)][0];
      if (name === 'eq') { startTest(); return; }
      A[name]();
    });
  }

      row.appendChild(tip);
      card.appendChild(row);
      summary.push(a.n + ': ' + area[i] + '/16 (' + BAND_NAME[band] + ')');
    });
    card.appendChild(el('p', 'fine', 'Ye ek self-reflection hai, psychological test ya diagnosis nahi. Aaj ka score bas ek shuruaat ka point hai — EQ practice se badhta hai.'));
    log.appendChild(card);
    down();
    bot(['Apna result **Shashi ko WhatsApp par bhejiye** — aur free webinar mein in par kaam shuru kijiye.']);
    lead(pct, summary);
  }
  function lead(pct, summary){
    var box = el('div', 'spa-msg spa-lead');
    var name = el('input');
    name.placeholder = 'Your name';
    name.autocomplete = 'name';
    var phone = el('input');
    phone.placeholder = 'WhatsApp number (10 digits)';
    phone.type = 'tel';
    phone.inputMode = 'numeric';
    phone.autocomplete = 'tel';
    var err = el('p', 'err');
    var send = el('button', '', 'Send my result on WhatsApp');
    send.type = 'button';
    send.addEventListener('click', function(){
      var n = name.value.trim();
      var p = phone.value.replace(/[^0-9]/g, '');
      if (p.length === 12) { if (p.indexOf('91') === 0) { p = p.slice(2); } }
      if (n.length === 0) { err.textContent = 'Please enter your name.'; return; }
      if (!/^[6-9][0-9]{9}$/.test(p)) { err.textContent = 'Please enter a valid 10-digit number.'; return; }
      err.textContent = '';
      var msg = ['Hi Shashi, maine website par free EQ check kiya.', '', 'Name: ' + n, 'WhatsApp: +91 ' + p,
        'Overall: ' + pct + '%'].concat(summary).concat(['', 'Mujhe free webinar ke baare mein bataiye.']).join('\n');
      window.open(wa(msg), '_blank');
      bot(['WhatsApp khul gaya hoga — bas **Send** dabaiye. Shashi aapko khud reply karengi.'], [
        ['Register for the free webinar', base + '#register', true]]);
    });
    box.appendChild(name);
    box.appendChild(phone);
    box.appendChild(err);
    box.appendChild(send);
    log.appendChild(box);
    buttons([['Take it again', startTest]]);
  }

  /* ---------------- open / close / end ---------------- */
  function checkAdmin(){
    /* only a logged-in visitor has the toolbar; nobody else pays for the request */
    if (!document.body.classList.contains('admin-bar')) { return Promise.resolve(); }
    return fetch('/wp-admin/admin-ajax.php?action=rest-nonce', {credentials: 'same-origin'}).then(function(r){
      return r.text();
    }).then(function(t){
      t = t.trim();
      if (t === '0') { return; }
      if (t.length !== 10) { return; }
      nonce = t;
      isAdmin = true;
      root.classList.add('admin');
      sub.textContent = 'Admin mode · topic likhiye ya ＋ Teach';
    }).catch(function(){});
  }
  function begin(){
    started = true;
    checkAdmin().then(function(){
      drawQuick();
      loadKB();
      A.hello();
    });
  }
  function open(){
    root.classList.add('open');
    if (!started) { begin(); }
    if (!testOn) { setTimeout(function(){ input.focus({preventScroll: true}); }, 60); }
  }
  function close(){
    closeReader();
    root.classList.remove('open');
  }
  function endChat(){
    if (testOn) { endTest(); }
    closeReader();
    log.textContent = '';
    form.hidden = false;
    input.value = '';
    A.hello();
  }
  fab.addEventListener('click', open);
  root.querySelector('.spa-x').addEventListener('click', close);
  root.querySelector('.spa-end').addEventListener('click', endChat);
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') { return; }
    if (reader.classList.contains('on')) { closeReader(); return; }
    close();
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var q = input.value.trim();
    if (q.length === 0) { return; }
    input.value = '';
    me(q);
    setTimeout(function(){ answer(q); }, 200);
  });
  /* any link to #eq-test opens the assistant straight into the check */
  function goTest(){
    open();
    var go = function(){ if (!testOn) { startTest(); } };
    if (kbReady) { go(); } else { setTimeout(go, 400); }
  }
  function fromHash(){
    if (location.hash === '#eq-test') {
      goTest();
      history.replaceState(null, '', location.pathname);
    }
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href$="#eq-test"]');
    if (!a) { return; }
    e.preventDefault();
    var menuOpen = document.querySelector('.sp.menu-open .burger');
    if (menuOpen) { menuOpen.click(); }
    goTest();
  });
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
