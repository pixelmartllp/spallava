name: Shashi Daily - Generate and post

# MANUAL ONLY. Renders the day's creatives and posts them straight to the
# Facebook Page + Instagram, skipping the review folder entirely.
#
# The everyday job is generate-review.yml + publish-approved.yml. This one is
# the escape hatch: use it to push a day out immediately, or as the fallback if
# Drive access ever breaks. Giving it a `schedule:` while those two are also
# scheduled would post the day twice.
#
# Windows runner on purpose: the brand fonts (constan.ttf / segoeui.ttf) ship
# with Windows and brand.py falls back to them. On Ubuntu the creatives would
# render in a different typeface.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many creatives to make'
        required: false
        default: '1'
      dry_run:
        description: 'Generate only - download the artifact, post nothing'
        type: boolean
        required: false
        default: false
      retry_only:
        description: 'Post nothing new - only retry what today already failed'
        type: boolean
        required: false
        default: false

permissions:
  contents: write            # to commit state/state.json back

concurrency:
  group: shashi-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post
        shell: pwsh
        env:
          # config.json is gitignored, so on the runner these secrets are the
          # only source of credentials.
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v25.0
        run: |
          $count = '${{ inputs.count }}'
          if ([string]::IsNullOrWhiteSpace($count)) { $count = '1' }

          if ('${{ inputs.retry_only }}' -eq 'true') {
            # Generates nothing; the per-image guard means only the creatives
            # that failed earlier today are actually attempted.
            python daily_run.py publish --confirm --keep-going
          } elseif ('${{ inputs.dry_run }}' -eq 'true') {
            python daily_run.py generate --count $count
          } else {
            # --skip-if-posted makes a re-run of the same day a no-op.
            python daily_run.py auto --count $count `
              --platforms facebook,instagram --confirm --keep-going --skip-if-posted
          }

      - name: Upload the day's creatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatives-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save publish state back to the repo
        if: always()
        shell: pwsh
        run: |
          git config user.name  "shashi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.json
          if ([string]::IsNullOrEmpty((git status --porcelain state/state.json))) {
            Write-Host "No state change."
          } else {
            git commit -m "Update publish state [skip ci]"
            git pull --rebase --autostash
            git push
          }
