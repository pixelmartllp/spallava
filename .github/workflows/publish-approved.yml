name: Shashi - Publish approved

# Step 2 of 2. Posts every creative you moved into the Drive review folder's
# 'Approved' subfolder to the Facebook Page + Instagram, then moves it to
# 'Posted' so it can never go out twice.
#
# Step 2 of 2, the partner of generate-review.yml.
#
# 10:00 IST posts what you approved, so approving early gets it out early.
# 11:00 IST is the CUTOFF: it posts Approved *plus* anything still sitting in
# Pending. So approving is optional and deleting is how you say no - delete a
# creative from Pending before 11:00 and it never goes out.
#
# 11:30 IST repeats the cutoff. Anything that posted has already been moved to
# Posted, so that run only ever sees what failed - and the Graph API returns a
# transient "code 1: please reduce the amount of data" often enough to lose a
# post most days.
#
# Times are UTC; India is UTC+5:30.
on:
  schedule:
    # Odd minutes on purpose - see the note in generate-review.yml. The
    # on-the-hour slots are the most contended on GitHub's scheduler and get
    # delayed or dropped.
    - cron: '38 4 * * *'    # 10:08 IST - post what is already Approved
    - cron: '39 5 * * *'    # 11:09 IST - CUTOFF: Approved + whatever is left in Pending
    - cron: '11 6 * * *'    # 11:41 IST - retry pass, see below
  workflow_dispatch:
    inputs:
      include_pending:
        description: 'Also post whatever is still in Pending'
        type: boolean
        required: false
        default: false

permissions:
  contents: write            # to commit state/state.json back

concurrency:
  group: shashi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone + write config
        shell: pwsh
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: |
          choco install rclone -y --no-progress
          "RCLONE_EXE=$((Get-Command rclone).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $conf = Join-Path $env:RUNNER_TEMP 'rclone.conf'
          $env:RCLONE_CONF_CONTENT | Out-File -FilePath $conf -Encoding ascii
          "RCLONE_CONFIG=$conf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Post approved creatives
        shell: pwsh
        env:
          DRIVE_REMOTE: shashi
          DRIVE_REVIEW_FOLDER_ID: ${{ secrets.DRIVE_REVIEW_FOLDER_ID }}
          # config.json is gitignored, so on the runner these are the only
          # source of credentials.
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v25.0
          # the 10:00 run posts Approved only; the two later ones sweep Pending too
          CUTOFF: ${{ github.event.schedule == '39 5 * * *' || github.event.schedule == '11 6 * * *' || inputs.include_pending }}
        run: |
          if ($env:CUTOFF -eq 'true') {
            python daily_run.py publish-approved --confirm --include-pending
          } else {
            python daily_run.py publish-approved --confirm
          }

      - name: Save publish state back to the repo
        if: always()
        shell: pwsh
        run: |
          git config user.name  "shashi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.json
          if ([string]::IsNullOrEmpty((git status --porcelain state/state.json))) {
            Write-Host "No state change."
          } else {
            git commit -m "Update publish state [skip ci]"
            git pull --rebase --autostash
            git push
          }

